<section class="lastworks" id="lastworks">
	<div class="lastworks__inner container">
		<header class="lastworks__header">
			<h2 class="lastworks__title">Latest Works</h2>
			<div class="lastworks__divider">
				<svg xmlns="http://www.w3.org/2000/svg" width="3000px" height="31" style="width: 5%">
					<path d="M0 15.5 L3000 15.5" style="fill: none; stroke: #bababa; stroke-width: 1px"></path>
				</svg>
			</div>
			<p class="lastworks__subtitle">RYAN'S PASSION IS PHOTOSHOOTS FOR LOOKBOOKS AND COMMERCIALS.</p>
		</header>

		<div class="lastworks__content">
			<div class="lastworks__carousel" data-carousel data-autoplay="true" data-autoplay-speed="4000">
				<button class="lastworks__arrow" type="button" data-carousel-prev aria-label="Previous slide">
					<span aria-hidden="true">‹</span>
				</button>

				<div class="lastworks__viewport" data-carousel-viewport>
					<div class="lastworks__track" data-carousel-track>
						<article class="lastworks__slide">
							<div class="lastworks__media">
								<img src="/img/lastworks/girl_1.png" alt="Illustration 1" loading="lazy" />
							</div>
						</article>
						<article class="lastworks__slide">
							<div class="lastworks__media">
								<img src="/img/lastworks/girl_2.png" alt="Illustration 2" loading="lazy" />
							</div>
						</article>
						<article class="lastworks__slide">
							<div class="lastworks__media">
								<img src="/img/lastworks/girl_3.png" alt="Illustration 3" loading="lazy" />
							</div>
						</article>
					</div>
				</div>

				<button class="lastworks__arrow" type="button" data-carousel-next aria-label="Next slide">
					<span aria-hidden="true">›</span>
				</button>
			</div>
		</div>
	</div>
</section>
